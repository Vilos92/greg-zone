services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: greg-zone
    restart: unless-stopped
    volumes:
      - 'tailscale-state:/var/lib/tailscale'
      - '/dev/net/tun:/dev/net/tun'
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    networks:
      - infrastructure
      - tailscale

  nginx-tailscale:
    image: nginx:alpine
    container_name: nginx-tailscale
    volumes:
      - './nginx/nginx-tailscale.conf:/etc/nginx/nginx.conf:ro'
      - './nginx/auth:/etc/nginx/auth:ro'
      - './nginx/index.html:/usr/share/nginx/html/index.html:ro'
    restart: unless-stopped
    depends_on:
      - copyparty
      - freshrss
      - kiwix
      - prowlarr
      - prometheus
      - grafana
      - hermes
      - woodpecker-server
    network_mode: service:tailscale

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    depends_on:
      - nginx-cloudflared
    command: tunnel --no-autoupdate run --token ${COPYPARTY_CLOUDFLARED_TOKEN}
    networks:
      - cloudflare

  nginx-cloudflared:
    image: nginx:alpine
    container_name: nginx-cloudflared
    ports:
      - '9847:80'
    volumes:
      - './nginx/nginx-cloudflare.conf:/etc/nginx/nginx.conf:ro'
      - './nginx/cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro'
      - './nginx/auth:/etc/nginx/auth:ro'
    restart: unless-stopped
    depends_on:
      - copyparty
      - freshrss
      - kiwix
      - woodpecker-server
    networks:
      cloudflare:
        ipv4_address: 172.19.0.10

  # Tailscale container for exit node routing (e.g., Mullvad VPN)
  # Transmission routes all traffic through this exit node
  tailscale-exit-node:
    image: tailscale/tailscale:latest
    container_name: tailscale-exit-node
    hostname: greg-zone-exit-node
    restart: unless-stopped
    volumes:
      - 'tailscale-exit-node-state:/var/lib/tailscale'
      - '/dev/net/tun:/dev/net/tun'
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - TS_AUTHKEY=${TAILSCALE_EXIT_NODE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    command:
      - sh
      - -c
      - |
        /usr/local/bin/containerboot &
        while ! tailscale status &>/dev/null; do sleep 1; done
        tailscale set --webclient
        tailscale web --listen 0.0.0.0:5252 &
        wait
    ports:
      - '5252:5252' # Tailscale web UI for exit node selection (accessible from host for configuration)
      - '9091:9091' # Transmission web UI (accessible from host via Tailscale network)
      - '51413:51413' # Transmission torrent port
      - '51413:51413/udp' # Transmission torrent port UDP
    networks:
      - tailscale

  copyparty:
    image: copyparty/dj:latest
    container_name: copyparty
    ports:
      - '3923:3923'
    user: '1000'
    environment:
      - LD_PRELOAD=/usr/lib/libmimalloc-secure.so.2
    volumes:
      - './copyparty/copyparty.conf:/app/copyparty.conf:ro'
      - './copyparty/copyparty-discord-hook.py:/app/copyparty-discord-hook.py:ro'
      - 'copyparty-hists:/cfg/hists'
      - '/Volumes/T7:/Volumes/T7'
      - '/Volumes/Wokyis M.2 SSD - Storage:/Volumes/Wokyis M.2 SSD - Storage'
    restart: unless-stopped
    command:
      [
        '--rproxy',
        '-1',
        '-c',
        '/app/copyparty.conf',
        '--xau',
        'f,t5,j,python3,/app/copyparty-discord-hook.py,--'
      ]
    networks:
      - infrastructure
      - tailscale
      - cloudflare

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: kiwix
    ports:
      - '8473:8080'
    volumes:
      - '/Volumes/T7/Vaults/Local Vault/media/zim:/data'
    restart: unless-stopped
    command: '**/*.zim'
    networks:
      - tailscale
      - cloudflare

  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    ports:
      - '49153:80'
    environment:
      - TZ=America/Los_Angeles
      - CRON_MIN=1,31
    volumes:
      - '/Volumes/Wokyis M.2 SSD - Storage/Vaults/GregZone Vault/Greg News/freshrss-data:/var/www/FreshRSS/data'
      - '/Volumes/Wokyis M.2 SSD - Storage/Vaults/GregZone Vault/Greg News/freshrss-extensions:/var/www/FreshRSS/extensions'
    restart: unless-stopped
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - tailscale
      - cloudflare

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    # All traffic (including UDP/51413) routes through tailscale-exit-node
    network_mode: 'service:tailscale-exit-node'
    depends_on:
      - tailscale-exit-node
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - USER=greg
      - PASS=${TRANSMISSION_PASSWORD}
    volumes:
      - '/Volumes/Wokyis M.2 SSD - Storage/Vaults/GregZone Vault/transmission-config:/config'
      - '/Volumes/Wokyis M.2 SSD - Storage/Vaults/GregZone Vault/torrent:/downloads'
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    # Tailscale-only access via nginx-tailscale reverse proxy
    network_mode: 'service:tailscale'
    depends_on:
      - tailscale
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - '/Volumes/Wokyis M.2 SSD - Storage/Vaults/GregZone Vault/prowlarr-config:/config'
    restart: unless-stopped

  # Hermes Agent — Tailscale dashboard only (no host FS / Docker socket / Cloudflare).
  # Data + secrets (Gemini, later Discord, etc.) persist under GregZone Vault/hermes.
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
    volumes:
      - '/Volumes/Wokyis M.2 SSD - Storage/Vaults/GregZone Vault/hermes:/opt/data'
      # Installs the local Slack adapter fork over the image's bundled copy at
      # boot, as root, before the gateway starts. The image's own per-profile
      # run script is regenerated on every boot, so patching there does not
      # survive a restart. The script itself lives in the hermes data dir
      # alongside the fork it installs; only this line is needed here, because
      # s6 scans /etc/cont-init.d/ and that path is inside the image.
      # See the script header for the post-`docker pull` upgrade procedure.
      - '/Volumes/Wokyis M.2 SSD - Storage/Vaults/GregZone Vault/hermes/container-init/03-patch-slack-adapter:/etc/cont-init.d/03-patch-slack-adapter:ro'
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - infrastructure
      - tailscale

  # Sparkify Slack/Spotify bot. Talks to Slack over Socket Mode and to the Spotify
  # Web API, both outbound, so it needs no ports and no reverse proxy entry.
  # Runs TypeScript source directly on Bun, so a code change needs a rebuild.
  sparkify:
    build: ./sparkify
    container_name: sparkify
    restart: unless-stopped
    environment:
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - SLACK_GENERAL_CHANNEL=${SLACK_GENERAL_CHANNEL}
      - SLACK_WORDLE_CHANNEL=${SLACK_WORDLE_CHANNEL}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN}
      - SPOTIFY_PLAYLIST_NAME=${SPOTIFY_PLAYLIST_NAME}
      - SPARKIFY_DB_PATH=/opt/data/sparkify.db
    volumes:
      - '/Volumes/Wokyis M.2 SSD - Storage/Vaults/GregZone Vault/sparkify:/opt/data'
    # Reports 503 when the Slack socket is closed, which the HTTP server alone cannot
    # tell you. Docker only surfaces the status — the in-process watchdog is what
    # exits a wedged bot so `unless-stopped` can rebuild it.
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          'process.exit((await fetch("http://localhost:8080/health")).ok ? 0 : 1)'
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - infrastructure

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - infrastructure
      - tailscale

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - '9093:9093'
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - infrastructure

  discord-webhook:
    build: ./discord-webhook
    container_name: discord-webhook
    restart: unless-stopped
    ports:
      - '8083:8080'
    environment:
      - DISCORD_JORDANIA_WEBHOOK_URL=${DISCORD_JORDANIA_WEBHOOK_URL}
      - DISCORD_COPYPARTY_WEBHOOK_URL=${DISCORD_COPYPARTY_WEBHOOK_URL}
      - DISCORD_PLEX_WEBHOOK_URL=${DISCORD_PLEX_WEBHOOK_URL}
      - DISCORD_NGINX_WEBHOOK_URL=${DISCORD_NGINX_WEBHOOK_URL}
      - DISCORD_INFRA_WEBHOOK_URL=${DISCORD_INFRA_WEBHOOK_URL}
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - infrastructure

  # Redis database for alert monitor state
  infra-redis:
    image: redis:8-alpine
    container_name: infra-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --requirepass "${INFRA_REDIS_PASSWORD}" --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - infrastructure

  infra-redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: infra-redis-commander
    environment:
      - REDIS_HOSTS=local:infra-redis:6379:0:${INFRA_REDIS_PASSWORD}
    ports:
      - '127.0.0.1:8084:8081'
    networks:
      - infrastructure
    depends_on:
      - infra-redis
    restart: unless-stopped

  # Services alert monitor (nginx, copyparty, freshrss, kiwix)
  services-alert-monitor:
    build:
      context: ./alert-monitors
      dockerfile: services/Dockerfile
    container_name: services-alert-monitor
    restart: unless-stopped
    environment:
      - LOKI_URL=http://loki:3100
      - WEBHOOK_URL=http://discord-webhook:8080/webhook
      - CHECK_INTERVAL=30
      - ALERT_MONITOR_SECRET=${ALERT_MONITOR_SECRET}
      - IP_API_ACCESS_KEY=${IP_API_ACCESS_KEY}
      - INFRA_REDIS_PASSWORD=${INFRA_REDIS_PASSWORD}
    networks:
      - infrastructure
    depends_on:
      - infra-redis
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  # Infrastructure alert monitor (loki, prometheus, grafana, etc.)
  infrastructure-alert-monitor:
    build:
      context: ./alert-monitors
      dockerfile: infrastructure/Dockerfile
    container_name: infrastructure-alert-monitor
    restart: unless-stopped
    environment:
      - LOKI_URL=http://loki:3100
      - WEBHOOK_URL=http://discord-webhook:8080/webhook
      - CHECK_INTERVAL=30
      - ALERT_MONITOR_SECRET=${ALERT_MONITOR_SECRET}
      - INFRA_REDIS_PASSWORD=${INFRA_REDIS_PASSWORD}
    networks:
      - infrastructure
    depends_on:
      - infra-redis
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  # Minecraft alert monitor (minecraft server)
  minecraft-alert-monitor:
    build:
      context: ./alert-monitors
      dockerfile: minecraft/Dockerfile
    container_name: minecraft-alert-monitor
    restart: unless-stopped
    environment:
      - LOKI_URL=http://loki:3100
      - WEBHOOK_URL=http://discord-webhook:8080/webhook
      - CHECK_INTERVAL=30
      - INFRA_REDIS_PASSWORD=${INFRA_REDIS_PASSWORD}
    networks:
      - infrastructure
      - playit
    depends_on:
      - infra-redis
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=greg
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - infrastructure
      - tailscale

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - '9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    logging:
      options:
        max-size: '10m'
        max-file: '2'
    networks:
      - infrastructure

  docker-stats-exporter:
    build: ./docker-stats-exporter
    container_name: docker-stats-exporter
    restart: unless-stopped
    ports:
      - '8081:8081'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - infrastructure

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - '--docker_only=true'
      - '--store_container_labels=true'
      - '--whitelisted_container_labels=name,image'
      - '--housekeeping_interval=10s'
      - '--max_housekeeping_interval=15s'
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - infrastructure
      - tailscale

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - infrastructure

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - infrastructure
      - tailscale
      - cloudflare
      - playit

  minecraft:
    image: itzg/minecraft-bedrock-server:latest
    platform: linux/amd64
    container_name: minecraft
    restart: unless-stopped
    environment:
      - EULA=TRUE
      - AUTO_PAUSE=TRUE
      - AUTO_PAUSE_DELAY=10
      - GAMEMODE=survival
      - DIFFICULTY=normal
      - ENABLE_SSH=true
    ports:
      - '19132:19132/udp'
    expose:
      - '2222'
    volumes:
      - '/Volumes/Wokyis M.2 SSD - Storage/Vaults/GregZone Vault/Minecraft/Jordania:/data'
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      playit:
        ipv4_address: 172.20.0.10

  minecraft-backup:
    image: kaiede/minecraft-bedrock-backup
    container_name: minecraft-backup
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - '/Volumes/Wokyis M.2 SSD - Storage/Vaults/GregZone Vault/Minecraft/Jordania_backups:/data'
      - '/Volumes/Wokyis M.2 SSD - Storage/Vaults/GregZone Vault/Minecraft/Jordania:/jordania'
      - './minecraft/backup/config.yml:/config/config.yml:ro'
    depends_on:
      - minecraft
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      playit:
        ipv4_address: 172.20.0.11

  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.16
    container_name: playit
    restart: unless-stopped
    depends_on:
      - minecraft
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_KEY}
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      options:
        max-size: '5m'
        max-file: '2'
    networks:
      playit:
        ipv4_address: 172.20.0.12

  mc-monitor:
    image: itzg/mc-monitor:latest
    container_name: mc-monitor
    restart: unless-stopped
    ports:
      - '8082:8080'
    environment:
      - EXPORT_BEDROCK_SERVERS=172.20.0.10:19132
      - EXPORT_PORT=8080
      - TIMEOUT=30s
    command: export-for-prometheus
    depends_on:
      - minecraft
    logging:
      options:
        max-size: '5m'
        max-file: '2'
    networks:
      - infrastructure
      - playit

  # Woodpecker CI — one instance serving any of Greg's GitHub repos (per-repo
  # opt-in from the UI). UI is Tailscale-only (http://greg-zone:9011 via
  # nginx-tailscale); GitHub webhooks reach it publicly through the Cloudflare
  # tunnel, which forwards only /api/hook (see nginx-cloudflare.conf).
  # GitHub connection is a classic OAuth app (GitHub Apps are unsupported by
  # Woodpecker); callback URL must be http://greg-zone:9011/authorize.
  # No host ports: agents connect over the internal network, nginx proxies the UI.
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3.17.0
    container_name: woodpecker-server
    restart: unless-stopped
    environment:
      - WOODPECKER_HOST=http://greg-zone:9011
      # Public URL GitHub delivers webhooks to; only /api/hook is exposed there.
      - WOODPECKER_EXPERT_WEBHOOK_HOST=https://woodpecker.greglinscheid.com
      - WOODPECKER_GITHUB=true
      - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT}
      - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      # Signs agent session tokens; persisting it keeps agents authenticated
      # across server restarts (server logs a warning if unset).
      - WOODPECKER_GRPC_SECRET=${WOODPECKER_GRPC_SECRET}
      # No open registration; only the admin GitHub account below can log in usefully.
      - WOODPECKER_OPEN=false
      - WOODPECKER_ADMIN=Vilos92
      # Unauthenticated /metrics on an internal-only port so the committed
      # prometheus.yml needs no bearer token. Not published to the host.
      - WOODPECKER_METRICS_SERVER_ADDR=:9001
    volumes:
      # SQLite DB + server state.
      - woodpecker-server-data:/var/lib/woodpecker
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - infrastructure
      - tailscale
      - cloudflare

  # Runs each pipeline step as a sibling container via the host Docker socket
  # (root-equivalent on the Docker VM — keep repos "untrusted" in Woodpecker
  # unless a pipeline genuinely needs privileged features).
  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3.17.0
    container_name: woodpecker-agent
    restart: unless-stopped
    command: agent
    depends_on:
      - woodpecker-server
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_BACKEND=docker
      # Parallel workflows on this one agent; sized for scriptlancer's fan-out.
      - WOODPECKER_MAX_WORKFLOWS=6
      # Mounted into every pipeline step container so `bun install` stays warm
      # across pipelines. Content-addressed store, safe to share across repos.
      # The plain-named volume is auto-created by Docker, outside compose's
      # lifecycle.
      - WOODPECKER_BACKEND_DOCKER_VOLUMES=woodpecker-bun-cache:/root/.bun/install/cache
    volumes:
      # Persists the agent's registration identity across recreates.
      - woodpecker-agent-config:/etc/woodpecker
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - infrastructure

networks:
  cloudflare:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24
  tailscale:
    driver: bridge
  playit:
    driver: bridge
    ipam:
      config:
