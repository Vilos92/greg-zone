events {
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Enhanced logging for security monitoring
    log_format security_monitoring '$remote_addr - $remote_user [$time_local] '
                                   '"$request" $status $body_bytes_sent '
                                   '"$http_referer" "$http_user_agent" '
                                   'host="$host" '
                                   'cf_ip="$http_cf_connecting_ip" '
                                   'cf_country="$http_cf_ipcountry" '
                                   'cf_ray="$http_cf_ray" '
                                   'real_ip="$http_x_real_ip" '
                                   'forwarded_for="$http_x_forwarded_for" '
                                   'health_check="$http_x_health_check"';
    
    access_log /var/log/nginx/access.log security_monitoring;
    error_log /var/log/nginx/error.log;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Copyparty-optimized settings (from official config)
    # Unlimited upload size for large files
    client_max_body_size 0;
    # Extended timeouts for large file transfers (~10 hours)
    client_header_timeout 610m;
    client_body_timeout 610m;
    send_timeout 610m;
    
    # Upstream definitions
    upstream copyparty {
        server copyparty:3923 fail_timeout=1s;
        keepalive 1;
    }
    
    upstream kiwix {
        server kiwix:8080 fail_timeout=1s;
        keepalive 1;
    }

    upstream woodpecker {
        server woodpecker-server:8000 fail_timeout=1s;
        keepalive 1;
    }
    
    # Cloudflare IP ranges for validation
    # https://www.cloudflare.com/ips/
    include /etc/nginx/cloudflare-ips.conf;
    
    # Use CF-Connecting-IP as the real IP
    real_ip_header CF-Connecting-IP;
    
    # Bot detection map (specific patterns first, then generic)
    map $http_user_agent $is_bot {
        default 0;
        # Specific bots
        ~*bingbot 1;
        ~*googlebot 1;
        ~*slurp 1;  # Yahoo
        ~*duckduckbot 1;
        ~*baiduspider 1;
        ~*yandex 1;
        ~*sogou 1;
        ~*exabot 1;
        ~*facebot 1;
        ~*ia_archiver 1;  # Archive.org
        # Generic patterns (catch-all)
        ~*bot 1;
        ~*crawler 1;
        ~*spider 1;
        ~*scraper 1;
    }
    
    # Copyparty service (official config adapted for docker + cloudflare)
    server {
        listen 80;
        server_name copyparty.greglinscheid.com;
        
        # Validate that CF headers only come from Cloudflare IPs or our tunnel (cloudflared)
        # With cloudflared tunnel, nginx sees $remote_addr = 172.19.0.x, so we must allow that
        if ($remote_addr !~* ^(173\.245\.|103\.21\.244\.|103\.22\.200\.|103\.31\.4\.|141\.101\.64\.|108\.162\.192\.|190\.93\.240\.|188\.114\.96\.|197\.234\.240\.|198\.41\.128\.|162\.158\.|104\.16\.|104\.24\.|172\.64\.|131\.0\.72\.|172\.19\.)) {
            set $http_cf_connecting_ip "";
            set $http_cf_ipcountry "";
            set $http_cf_ray "";
        }
        
        # Crawlers get a real robots.txt instead of the bot block below. A
        # 4xx (or a 444 connection close) on robots.txt does not mean "stay
        # out": RFC 9309 reads an unavailable robots.txt as "no rules, crawl
        # freely" and an unreachable one as "retry later, forever". Only a
        # served Disallow actually stops a well-behaved crawler. This must be
        # its own location because the server-level bot `if` runs in the
        # rewrite phase, before any location is chosen.
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        location / {
            # Block bots (return 403)
            if ($is_bot) {
                return 403;
            }

            proxy_pass http://copyparty;
            proxy_redirect off;
            
            # Disable buffering for streaming (essential for copyparty)
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Optimize download speed (600 → 1500 MiB/s per official config)
            proxy_buffers 32 8k;
            proxy_buffer_size 16k;
            proxy_busy_buffers_size 24k;
            
            # Headers optimized for copyparty + cloudflare
            proxy_set_header Connection "Keep-Alive";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # Use CF-Connecting-IP for real client IP (per official config)
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            # Forward CF headers only if they're valid
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_set_header CF-Ray $http_cf_ray;
        }
    }
    
    # Kiwix service with basic auth
    server {
        listen 80;
        server_name kiwix.greglinscheid.com;
        
        # Basic authentication
        auth_basic "Kiwix Access - Private Content";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        # Crawlers get a real robots.txt instead of the bot block below. A
        # 4xx (or a 444 connection close) on robots.txt does not mean "stay
        # out": RFC 9309 reads an unavailable robots.txt as "no rules, crawl
        # freely" and an unreachable one as "retry later, forever". Only a
        # served Disallow actually stops a well-behaved crawler. This must be
        # its own location because the server-level bot `if` runs in the
        # rewrite phase, before any location is chosen.
        location = /robots.txt {
            auth_basic off;
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        location / {
            # Block bots (return 403)
            if ($is_bot) {
                return 403;
            }

            proxy_pass http://kiwix;
            proxy_redirect off;
            
            # Standard reverse proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            
            # Basic proxy settings
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
    
    # Woodpecker CI — webhook ingress only. The UI lives on Tailscale
    # (greg-zone:9011); the public hostname exists solely so GitHub can
    # deliver webhooks, so every other path is refused.
    server {
        listen 80;
        server_name woodpecker.greglinscheid.com;

        location = /api/hook {
            proxy_pass http://woodpecker;
            proxy_redirect off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Crawlers get a real robots.txt instead of the bot block below. A
        # 4xx (or a 444 connection close) on robots.txt does not mean "stay
        # out": RFC 9309 reads an unavailable robots.txt as "no rules, crawl
        # freely" and an unreachable one as "retry later, forever". Only a
        # served Disallow actually stops a well-behaved crawler. This must be
        # its own location because the server-level bot `if` runs in the
        # rewrite phase, before any location is chosen.
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # A 404 ends the sitemap probe; the 444 below reads as a network
        # failure and gets retried indefinitely.
        location = /sitemap.xml {
            return 404;
        }

        location / {
            return 444; # Close connection without response
        }
    }

    # Default server for unmatched domains
    server {
        listen 80 default_server;
        server_name _;
        return 444; # Close connection without response
    }
}
