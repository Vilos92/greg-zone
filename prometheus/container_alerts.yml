groups:
  - name: container_health
    # Selectors here are deliberately exclusion-based rather than an allow-list of
    # container names. An allow-list silently stops covering every service added after
    # it was written, which is how sparkify, hermes, prowlarr, tailscale-exit-node and
    # the six github-runners went unmonitored.
    rules:
      # Any container that was reporting and then stopped. Covers every container
      # without naming one, so a new service is monitored the day it is added.
      #
      # The `and on()` clause suppresses this whole rule while docker-stats-exporter is
      # itself absent. Without it, restarting the exporter drops every series at once
      # and reports the entire estate as down; a full redeploy was observed pending 35
      # of these before the exporter finished repopulating. The exporter going away is
      # still caught, by CoreContainerAbsent below.
      #
      # Blind spot: a container already down before Prometheus started was never in the
      # offset window, which CoreContainerAbsent also covers for the critical few.
      - alert: ContainerDown
        expr: (container_cpu_usage_percent{job="docker-stats"} offset 5m unless container_cpu_usage_percent{job="docker-stats"}) and on() (count(container_cpu_usage_percent{job="docker-stats",name="docker-stats-exporter"}) > 0)
        # Five minutes rather than two, so a slow exporter restart cannot page about
        # containers that are running fine.
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Container {{ $labels.name }} is down'
          description: 'Container {{ $labels.name }} was reporting metrics and has stopped.'

      # The alerting path itself, plus the services whose silence would go unnoticed.
      # Deliberately short: this is the cold-start safety net for things that must
      # always exist, not a register of everything running.
      - alert: CoreContainerAbsent
        expr: absent(container_cpu_usage_percent{job="docker-stats",name="prometheus"}) or absent(container_cpu_usage_percent{job="docker-stats",name="alertmanager"}) or absent(container_cpu_usage_percent{job="docker-stats",name="discord-webhook"}) or absent(container_cpu_usage_percent{job="docker-stats",name="docker-stats-exporter"}) or absent(container_cpu_usage_percent{job="docker-stats",name="loki"}) or absent(container_cpu_usage_percent{job="docker-stats",name="cloudflared"}) or absent(container_cpu_usage_percent{job="docker-stats",name="tailscale"}) or absent(container_cpu_usage_percent{job="docker-stats",name="sparkify"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'A core container is absent'
          description: 'One of prometheus, alertmanager, discord-webhook, docker-stats-exporter, loki, cloudflared, tailscale or sparkify is not reporting metrics at all.'

      # Container restarting frequently
      - alert: ContainerRestarting
        expr: rate(container_start_time_seconds{job="docker-stats",name!=""}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ $labels.name }} is restarting frequently'
          description: 'Container {{ $labels.name }} has restarted more than 6 times in the last 5 minutes (rate > 0.1 restarts/second).'

      # High memory usage
      - alert: ContainerHighMemoryUsage
        expr: (container_memory_usage_bytes{job="docker-stats",name!=""} / container_memory_limit_bytes{job="docker-stats",name!=""}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ $labels.name }} high memory usage'
          description: 'Container {{ $labels.name }} is using {{ $value | humanizePercentage }} of its memory limit (threshold: >90% for 5 minutes).'

      # High CPU usage
      - alert: ContainerHighCPUUsage
        expr: container_cpu_usage_percent{job="docker-stats",name!=""} > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ $labels.name }} high CPU usage'
          description: 'Container {{ $labels.name }} is using {{ $value }}% CPU (threshold: >80% for 5 minutes).'

      # Disk space running low
      - alert: ContainerHighDiskUsage
        expr: (container_fs_usage_bytes{job="docker-stats",name!=""} / container_fs_limit_bytes{job="docker-stats",name!=""}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ $labels.name }} high disk usage'
          description: 'Container {{ $labels.name }} is using {{ $value | humanizePercentage }} of its disk space (threshold: >90% for 5 minutes).'

      # Container OOMKilled
      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total{job="docker-stats",name!=""}[1h]) > 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: 'Container {{ $labels.name }} was OOMKilled'
          description: 'Container {{ $labels.name }} was killed due to out of memory (OOM events detected in the last hour).'
