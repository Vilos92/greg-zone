groups:
  - name: container_health
    # Selectors here are deliberately exclusion-based rather than an allow-list of
    # container names. An allow-list silently stops covering every service added after
    # it was written, which is how sparkify, hermes, prowlarr, tailscale-exit-node and
    # the six github-runners went unmonitored.
    rules:
      # Any container that was reporting and then stopped. Covers every container
      # without naming one, so a new service is monitored the day it is added.
      #
      # The `and on()` clause suppresses this whole rule while docker-stats-exporter is
      # itself absent. Without it, restarting the exporter drops every series at once
      # and reports the entire estate as down; a full redeploy was observed pending 35
      # of these before the exporter finished repopulating. The exporter going away is
      # still caught, by CoreContainerAbsent below.
      #
      # Blind spot: a container already down before Prometheus started was never in the
      # offset window, which CoreContainerAbsent also covers for the critical few.
      - alert: ContainerDown
        expr: (container_cpu_usage_percent{job="docker-stats"} offset 5m unless container_cpu_usage_percent{job="docker-stats"}) and on() (count(container_cpu_usage_percent{job="docker-stats",name="docker-stats-exporter"}) > 0)
        # Five minutes rather than two, so a slow exporter restart cannot page about
        # containers that are running fine.
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Container {{ $labels.name }} is down'
          description: 'Container {{ $labels.name }} was reporting metrics and has stopped.'

      # The alerting path itself, plus the services whose silence would go unnoticed.
      # Deliberately short: this is the cold-start safety net for things that must
      # always exist, not a register of everything running.
      - alert: CoreContainerAbsent
        expr: absent(container_cpu_usage_percent{job="docker-stats",name="prometheus"}) or absent(container_cpu_usage_percent{job="docker-stats",name="alertmanager"}) or absent(container_cpu_usage_percent{job="docker-stats",name="discord-webhook"}) or absent(container_cpu_usage_percent{job="docker-stats",name="docker-stats-exporter"}) or absent(container_cpu_usage_percent{job="docker-stats",name="loki"}) or absent(container_cpu_usage_percent{job="docker-stats",name="cloudflared"}) or absent(container_cpu_usage_percent{job="docker-stats",name="tailscale"}) or absent(container_cpu_usage_percent{job="docker-stats",name="sparkify"}) or absent(container_cpu_usage_percent{job="docker-stats",name="woodpecker-server"}) or absent(container_cpu_usage_percent{job="docker-stats",name="woodpecker-agent"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'A core container is absent'
          description: 'One of prometheus, alertmanager, discord-webhook, docker-stats-exporter, loki, cloudflared, tailscale, sparkify, woodpecker-server or woodpecker-agent is not reporting metrics at all. Woodpecker qualifies because CI dying is silent: pipelines queue forever and PRs simply never get checks.'

      # Container restarting frequently
      - alert: ContainerRestarting
        expr: rate(container_start_time_seconds{job="docker-stats",name!=""}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ $labels.name }} is restarting frequently'
          description: 'Container {{ $labels.name }} has restarted more than 6 times in the last 5 minutes (rate > 0.1 restarts/second).'

      # High memory usage
      - alert: ContainerHighMemoryUsage
        expr: (container_memory_usage_bytes{job="docker-stats",name!=""} / container_memory_limit_bytes{job="docker-stats",name!=""}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ $labels.name }} high memory usage'
          description: 'Container {{ $labels.name }} is using {{ $value | humanizePercentage }} of its memory limit (threshold: >90% for 5 minutes).'

      # High CPU usage
      - alert: ContainerHighCPUUsage
        expr: container_cpu_usage_percent{job="docker-stats",name!=""} > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ $labels.name }} high CPU usage'
          description: 'Container {{ $labels.name }} is using {{ $value }}% CPU (threshold: >80% for 5 minutes).'

      # Disk space running low
      - alert: ContainerHighDiskUsage
        expr: (container_fs_usage_bytes{job="docker-stats",name!=""} / container_fs_limit_bytes{job="docker-stats",name!=""}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ $labels.name }} high disk usage'
          description: 'Container {{ $labels.name }} is using {{ $value | humanizePercentage }} of its disk space (threshold: >90% for 5 minutes).'

      # Loki enforces retention through the compactor, not through retention_period
      # alone. With no compactor block, retention_period is inert: Loki accepts it,
      # deletes nothing, and says so only in its own logs. That ran for ten months and
      # grew loki-data to 17GB, because Loki was not a scrape target and nobody reads a
      # healthy service's logs. The scrape job in prometheus.yml exists mainly for this.
      #
      # The metric is 0 until the first successful run, so time() - 0 is enormous and
      # this covers "never succeeded" as well as "stopped succeeding". A restart resets
      # it to 0, so `for` must exceed the ~10m ring-stability wait plus the 15m
      # apply_retention_interval, or every Loki restart pages.
      #
      # The absent() branch is not redundant with CoreContainerAbsent. That rule catches
      # the loki *container* vanishing; this catches the *metric* vanishing while Loki
      # runs fine -- which is what happens if the compactor block is ever removed again.
      # Without it the naive `time() - metric` expr has no series to evaluate and goes
      # silent, reproducing the original ten-month failure exactly. Verified by querying
      # the expr against a nonexistent metric: naive = silent, guarded = fires. The
      # `and on() up{job="loki"} == 1` scopes it to "Loki is up and scraping but not
      # reporting retention", so a Loki outage pages once via CoreContainerAbsent
      # instead of twice.
      #
      # `name: loki` is what fills the container field in the Discord embed -- the mux
      # reads labels.container_name or labels.name, and renders "Unknown Container"
      # without it.
      - alert: LokiRetentionStalled
        expr: (time() - loki_compactor_apply_retention_last_successful_run_timestamp_seconds > 3600) or (absent(loki_compactor_apply_retention_last_successful_run_timestamp_seconds) and on() (up{job="loki"} == 1))
        for: 30m
        labels:
          severity: warning
          name: loki
        annotations:
          summary: 'Loki log retention has stopped deleting'
          description: 'Loki has not completed a successful retention run in over an hour (one is attempted every 15 minutes), or has stopped reporting retention metrics altogether. Expired chunks are accumulating and loki-data will grow unbounded. Check `docker logs loki | grep "failed to apply retention"` -- a single unremovable chunk entry aborts the entire run, so one corrupt index table stops retention for every table.'

      # Container OOMKilled
      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total{job="docker-stats",name!=""}[1h]) > 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: 'Container {{ $labels.name }} was OOMKilled'
          description: 'Container {{ $labels.name }} was killed due to out of memory (OOM events detected in the last hour).'
