global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'container_alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor for Docker container metrics
  - job_name: 'docker-stats'
    static_configs:
      - targets: ['docker-stats-exporter:8081']
    scrape_interval: 10s
    metrics_path: /metrics

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 5s
    metrics_path: /metrics

  # Nginx metrics (if nginx-prometheus-exporter is added later)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-tailscale:9113']
    scrape_interval: 5s
    metrics_path: /metrics

  # Note: Removed docker-services health checks as these services don't expose /health endpoints

  # Alertmanager monitoring
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 30s

  # Grafana monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics
    scrape_interval: 30s

  # Minecraft server monitoring via mc-monitor
  # Intentionally commented out: mc-monitor is profile-gated in
  # docker-compose.yml, so this job would be a permanently red target. Leave it
  # commented unless Greg explicitly asks for Minecraft back, in which case
  # re-enable it alongside `COMPOSE_PROFILES=minecraft ./docker-services.sh up`.
  # - job_name: 'minecraft-monitor'
  #   static_configs:
  #     - targets: ['mc-monitor:8080']
  #   scrape_interval: 15s
  #   metrics_path: /metrics

  # Woodpecker CI (unauthenticated metrics on internal-only port 9001,
  # see WOODPECKER_METRICS_SERVER_ADDR in docker-compose.yml)
  - job_name: 'woodpecker'
    static_configs:
      - targets: ['woodpecker-server:9001']
    scrape_interval: 30s
    metrics_path: /metrics
